name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bookstore:bookstore@localhost:5432/bookstore
      SEED_USER_PASSWORD: ci-only-password-123
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookstore
          POSTGRES_PASSWORD: bookstore
          POSTGRES_DB: bookstore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bookstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bookstore/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:phase3
      - run: npm run test:promotions
      - run: npm run build
      - name: Start application
        run: npm run start > /tmp/bookstore.log 2>&1 &
      - name: Wait for readiness
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:3000/api/health/ready
      - run: npm run test:p0
      - run: npm run test:storefront
      - run: npm run test:hardening
