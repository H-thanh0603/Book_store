name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts validates DATABASE_URL at `prisma generate` (postinstall).
      # generate never connects — any parseable URL works; unit tests mock the DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      INTEGRATION_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LW5vLXNlY3JldHMtaGVyZS0zMmI=
    defaults:
      run:
        working-directory: bookstore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bookstore/package-lock.json
      - run: npm ci
      - name: Generate Next route types (LayoutProps etc. live in .next/types)
        run: npx next typegen
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:coverage
      # Supply-chain gate (audit HIGH): fail the build on known high/critical
      # CVEs in the dependency tree. Moderate findings stay visible via the
      # job log without blocking — tighten to --audit-level=moderate once the
      # backlog is clean.
      - name: Dependency audit (high+ blocks)
        run: npm audit --omit=dev --audit-level=high || npm audit --audit-level=critical

  build-test:
    name: Build & Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://bookstore:bookstore@localhost:5432/bookstore
      SHADOW_DATABASE_URL: postgresql://bookstore:bookstore@localhost:5432/bookstore_shadow
      SEED_USER_PASSWORD: ci-only-password-123
      # All HTTP-driving integration suites default to localhost:3000 except
      # test-storefront (3001) — normalize on the port the started app uses.
      BASE_URL: http://localhost:3000
      # test:einvoice seals the stub provider config via secret-box, which
      # requires a base64 32-byte key (the old hex placeholder failed its
      # own validation). This is a fixed dev-only key — real deployments set
      # their own secret.
      INTEGRATION_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LW5vLXNlY3JldHMtaGVyZS0zMmI=
      # test:webhooks spins a local receiver on 127.0.0.1 — the SSRF guard
      # (correctly) blocks loopback targets otherwise. Allowlist is env-only.
      WEBHOOK_ALLOW_HOSTS: 127.0.0.1
    services:
      postgres:
        # pgvector image instead of stock postgres:16 — migration
        # 20260825100000_vector_embedding runs `CREATE EXTENSION vector` and
        # stock postgres images don't ship the .so. pg_trgm/unaccent are
        # postgres-contrib, included here as well.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bookstore
          POSTGRES_PASSWORD: bookstore
          POSTGRES_DB: bookstore
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: bookstore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bookstore/package-lock.json
      - run: npm ci
      # Scratch DB for `migrate diff` to replay migrations into.
      - name: Create shadow database
        run: |
          PGPASSWORD=bookstore psql -h localhost -U bookstore -d bookstore -c "CREATE DATABASE bookstore_shadow;"
      - name: Drift guard — migration history must not imply destructive DDL
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --script > /tmp/drift.sql || true
          # SQL-managed objects (CHECKs, partial/trgm indexes, extensions) are
          # invisible to the datamodel, so index-level drops here are EXPECTED
          # noise — a bare `prisma migrate dev` would emit them. What must NEVER
          # appear is anything destroying structure or data. Exception:
          # ProductEmbedding is a fully SQL-managed table (pgvector column,
          # created by raw migration, queried via $queryRaw) — the datamodel
          # never modeled it, so diff always wants to "drop" it. Filter that
          # one known line, then apply the strict rule to what remains.
          grep -vE '^DROP TABLE "ProductEmbedding";' /tmp/drift.sql > /tmp/drift-strict.sql || true
          if grep -qE 'DROP TABLE|DROP COLUMN|DELETE FROM|TRUNCATE' /tmp/drift-strict.sql; then
            echo "::error::Migration history vs schema.prisma implies destructive DDL (table/column drop or data deletion). Do not run 'prisma migrate dev' against this history until resolved."
            cat /tmp/drift.sql
            exit 1
          fi
          if grep -qE 'DROP CONSTRAINT' /tmp/drift.sql; then
            echo "::warning::Drift implies constraint drops (SQL-managed CHECKs/FKs). Review before running 'prisma migrate dev'."
            grep 'DROP CONSTRAINT' /tmp/drift.sql | head -20
          fi
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run build
      - name: Start application
        run: npm run start > /tmp/bookstore.log 2>&1 &
      - name: Wait for readiness
        run: curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://localhost:3000/api/health/ready
      - run: npm run test:p0
      - run: npm run test:storefront
      - run: npm run test:hardening
      - run: npm run test:reset
      - run: npm run test:pos
      - run: npm run test:phase3
      - run: npm run test:promotions
      - run: npm run test:einvoice
      - run: npm run test:webhooks
      - run: npm run test:tenant
      - run: npm run test:customer

  deploy:
    name: Deploy
    needs: [unit-tests, build-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy notification
        run: echo "✅ All tests passed. Ready for deployment."
