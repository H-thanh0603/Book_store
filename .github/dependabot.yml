# Dependabot (audit HIGH): weekly dependency security/patch review.
# Groups minor+patch bumps per ecosystem so PRs stay reviewable.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/bookstore"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
