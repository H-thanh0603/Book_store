;; PgBouncer Configuration — Bookstore Multi-Instance
;; ---------------------------------------------------
;; Purpose: pool PostgreSQL connections across all app instances so that
;; DB_POOL_MAX × instances stays far below Postgres max_connections.
;;
;; Example: 4 instances × DB_POOL_MAX=10 = 40 client connections → PgBouncer
;; multiplexes them onto default_pool_size=20 real Postgres connections.
;;
;; Install: apt install pgbouncer  (or the official Docker image: edoburu/pgbouncer)
;; Run:     pgbouncer -d /etc/pgbouncer/pgbouncer.ini
;;
;; App side (set in .env):
;;   DATABASE_URL=postgresql://bookstore:<pw>@127.0.0.1:6432/bookstore?pool_timeout=10
;;   DB_POOL_MAX can stay modest (5-10) — PgBouncer absorbs the burst.
;;
;; CRITICAL — transaction pooling caveats (pool_mode=transaction):
;; - Prisma works fine over node-pg's unnamed prepared statements.
;; - Session-level features are NOT available: LISTEN/NOTIFY, advisory locks,
;;   SET search_path, temp tables. This app uses none of those in request paths.

[databases]
;; Map the bookstore db; connect to Postgres as the app role.
;; host/port point at the REAL postgres, not another bouncer.
bookstore = host=127.0.0.1 port=5432 dbname=bookstore

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; --- Pool sizing -----------------------------------------------------------
;; Total real connections to Postgres across ALL databases/users.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 200          ; client-side ceiling (app instances × DB_POOL_MAX + headroom)

;; Transaction pooling: a server connection is assigned per transaction, not
;; per session — this is what lets N instances share few real connections.
pool_mode = transaction

;; --- Timeouts & hygiene ----------------------------------------------------
server_idle_timeout = 60
server_lifetime = 3600
client_idle_timeout = 0        ; app pools hold clients open — do NOT reap them
idle_transaction_timeout = 30  ; kill stuck transactions holding slots
query_timeout = 30
server_connect_timeout = 5

;; Health checks
server_check_query = SELECT 1
server_check_delay = 10

;; --- Auth ------------------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt   ; "userlist.txt": "bookstore" "<scram verifier>"
;; With auth_user set, unknown users are verified against Postgres directly:
; auth_user = pgbouncer_admin

admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

;; --- Logging ---------------------------------------------------------------
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

;; Ignore startup parameters that transaction pooling cannot honor
ignore_startup_parameters = extra_float_digits,search_path,options
