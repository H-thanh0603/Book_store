# Nginx Load Balancer for Bookstore Multi-Instance
# -------------------------------------------------
# Install: cp deploy/nginx.conf /etc/nginx/conf.d/bookstore.conf && nginx -t && systemctl reload nginx
#
# TWO supported topologies — pick ONE upstream block:
#
# (A) PM2 CLUSTER on one host  (`pm2 start ecosystem.config.js`):
#     Node's cluster module makes every worker share a single listening socket,
#     so the kernel already round-robins across workers → point at ONE port.
#
# (B) SEPARATE PROCESSES / HOSTS (PM2 fork mode, systemd units, containers):
#     each instance owns its port → list them all and let nginx distribute.

# ── Topology A: PM2 cluster, single socket ──────────────────────────────────
upstream bookstore_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Topology B: independent instances (uncomment, adjust) ───────────────────
# upstream bookstore_backend {
#     least_conn;
#     server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
#     server 127.0.0.1:3001 max_fails=3 fail_timeout=15s;
#     server 127.0.0.1:3002 max_fails=3 fail_timeout=15s;
#     # other hosts: server 10.0.1.11:3000 ...
#     keepalive 32;
# }

# ── Cloudflare real visitor IP ──────────────────────────────────────────────
# Behind Cloudflare, $remote_addr is the CF edge, not the visitor. The realip
# module restores the visitor address so rate limiting keys off real IPs.
# Ranges: https://www.cloudflare.com/ips/ — refresh when Cloudflare updates.
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
# set_real_ip_from 2803:f800::/32;
# set_real_ip_from 2405:b500::/32;
# set_real_ip_from 2405:8100::/32;
# set_real_ip_from 2a06:98c0::/29;
# set_real_ip_from 2c0f:f248::/32;
# real_ip_header CF-Connecting-IP;

# Port 80 exists ONLY to redirect to HTTPS (and serve the ACME challenge for
# certbot issuance/renewal). No application traffic in cleartext.
server {
    listen 80;
    server_name bookstore.example.com;

    # certbot --nginx or webroot writes here during issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS termination. One-time setup:
#   certbot certonly --webroot -w /var/www/certbot -d bookstore.example.com
#   systemctl reload nginx   (renewals via the standard certbot timer)
server {
    listen 443 ssl http2;
    server_name bookstore.example.com;

    ssl_certificate     /etc/letsencrypt/live/bookstore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookstore.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: browsers refuse plain HTTP for max-age once they've seen this.
    # Only enable when you are certain HTTPS serving is permanent.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://bookstore_backend;
        proxy_http_version 1.1;

        # Client-IP forwarding — required by TRUST_PROXY_HEADERS=true in the app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reuse upstream keepalive connections
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Retry idempotent methods on the next instance; NEVER retry POST
        # (a retried checkout would double-create orders).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_non_idempotent off;
    }

    # Immutable build assets — pin at the edge for a year.
    # NOTE: a location with its own add_header drops inherited headers, so HSTS
    # is restated wherever Cache-Control is added below.
    location /_next/static/ {
        proxy_pass http://bookstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Health probes must never be cached or retried across instances.
    location = /api/health/live {
        proxy_pass http://bookstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
    location = /api/health/ready {
        proxy_pass http://bookstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    # Storefront: GET responses carry Cache-Control from the app itself (CDN keys on
    # the full URL); POST (checkout) is never cached by any conforming CDN/proxy.
    location /api/storefront {
        proxy_pass http://bookstore_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
